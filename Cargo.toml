[package]
name = "threema-cli"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
libthreema = { path = "../threema-desktop/packages/libthreema-wasm/libs/libthreema/lib", features = [
    "cli",
] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = [
    "http2",
    "native-tls",
] }
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "signal",
    "sync",
    "time",
] }
tokio-tungstenite = { version = "0.28", default-features = false, features = [
    "connect",
    "native-tls",
] }
tracing = "0.1"

# libthreema is written against a locally patched `blake2` (adds a non-keyed hash with
# parameters); this mirrors the `[patch.crates-io]` entry from its own workspace root, which
# doesn't apply here since threema-cli isn't a member of that workspace.
[patch.crates-io]
blake2 = { path = "../threema-desktop/packages/libthreema-wasm/libs/libthreema/patches/blake2" }

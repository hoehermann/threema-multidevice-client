[package]
name = "threema-multidevice-client"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "threema-cli"
path = "src/main.rs"

[dependencies]
libthreema = { git = "https://github.com/hoehermann/threema-desktop", branch = "feature/sending", features = [
    "cli",
] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
futures-util = "0.3"
prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = [
    "http2",
    "native-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "rt",
    "signal",
    "sync",
    "time",
] }
tokio-tungstenite = { version = "0.28", default-features = false, features = [
    "connect",
    "native-tls",
] }
tracing = "0.1"

[dev-dependencies]
# Only used to build a realistic encrypted fixture in d2d.rs's test, independently of the real
# decrypt path (`DeviceGroupKey::decrypt_reflected_envelope`) it's cross-checked against.
aead = "0.5"
blake2 = { version = "0.10", default-features = false, features = ["std"] }
crypto_secretbox = { version = "0.1", default-features = false, features = [
    "alloc",
    "salsa20",
] }

# libthreema is written against a locally patched `blake2` (adds a non-keyed hash with
# parameters); this mirrors the `[patch.crates-io]` entry from its own workspace root, which
# doesn't apply here since threema-cli isn't a member of that workspace.
[patch.crates-io]
blake2 = { git = "https://github.com/hoehermann/threema-desktop", branch = "feature/sending" }
